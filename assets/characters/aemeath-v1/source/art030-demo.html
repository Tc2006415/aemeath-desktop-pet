<script>/* ART028 preview only. No production scheduler or native drag integration. */
class WinkPreviewEngine {
 constructor(random=Math.random){this.random=random;this.dragging=false;this.winkStart=null;this.nextWink=this.delay();this.nextBlink=4000;this.lastDelay=this.nextWink;this.lastReason='initial';}
 delay(){return 50000+Math.floor(this.random()*20000);}
 schedule(t,reason){this.lastDelay=this.delay();this.nextWink=t+this.lastDelay;this.nextBlink=t+4000;this.lastReason=reason;}
 begin(t){if(this.dragging||this.winkStart!==null)return false;this.winkStart=t;this.nextWink=Infinity;this.nextBlink=Infinity;return true;}
 press(t){this.dragging=true;this.winkStart=null;this.nextWink=Infinity;this.nextBlink=Infinity;this.lastReason='drag-interrupt';}
 release(t){if(!this.dragging)return;this.dragging=false;this.schedule(t,'drag-release');}
 update(t){
  if(this.dragging)return;
  if(this.winkStart!==null&&t>=this.winkStart+1200){const end=this.winkStart+1200;this.winkStart=null;this.schedule(end,'wink-end');}
  if(this.winkStart===null&&t>=this.nextWink)this.begin(t);
  if(this.winkStart===null&&t>=this.nextBlink+240)this.nextBlink=t+4000;
 }
 sample(t){this.update(t);const w=t%1400,ends=[400,550,700,1100,1250,1400],wings=['A','B','C','C','B','A'];let pose='open',phase='等待随机wink';
  if(this.dragging)phase='模拟拖动中 · 已回正';
  else if(this.winkStart!==null){const d=t-this.winkStart;pose=d<250?'mid':d<700?'wink':d<1050?'mid':'open';phase=d<250?'进入':d<700?'wink停留':d<1050?'回正':'稳定';}
  else if(t>=this.nextBlink){const d=t-this.nextBlink;pose=d<60?'half':d<140?'closed':d<200?'half':'open';phase='自然眨眼（4秒仅演示）';}
  return{wing:wings[ends.findIndex(e=>w<e)],pose,phase,remaining:this.nextWink-t,dragging:this.dragging,winking:this.winkStart!==null};
 }
 nextBoundary(t){this.update(t);let points=[...Array.from({length:2},(_,i)=>Math.floor(t/1400)+i).flatMap(k=>[0,400,550,700,1100,1250,1400].map(d=>k*1400+d))];
  if(this.winkStart!==null)points.push(...[250,700,1050,1200].map(d=>this.winkStart+d));else if(!this.dragging)points.push(this.nextWink,...[0,60,140,200,240].map(d=>this.nextBlink+d));
  return Math.min(...points.filter(v=>Number.isFinite(v)&&v>t+0.001));
 }
}
if(typeof module!=='undefined')module.exports=WinkPreviewEngine;

function hemAt(t,dragging=false,enabled=true){if(dragging||!enabled)return 'base';const p=t%1400;return p<400?'base':p<550?'light':p<1200?'upper':p<1350?'light':'base';}
function nextHemBoundary(t){const base=Math.floor(t/1400)*1400;return [400,550,1200,1350,1400].map(d=>base+d).find(v=>v>t+.001);}
if(typeof module!=='undefined')module.exports={hemAt,nextHemBoundary};

const pickupFrames=['neutral','surprise','pickup','hold-entry'],pickupEnds=[80,160,260,360];
function pickupAt(elapsed){return {index:Math.min(3,pickupEnds.findIndex(e=>elapsed<e)<0?3:pickupEnds.findIndex(e=>elapsed<e)),done:elapsed>=360};}
if(typeof module!=='undefined')module.exports={pickupAt,pickupEnds,pickupFrames};

const $=id=>document.getElementById(id),engine=new WinkPreviewEngine();let origin=performance.now(),paused=false,t=0,pickStart=null,lastShown='idle:A-open-base';
function now(){return paused?t:performance.now()-origin}
function idleKey(time){if($('source').value!=='live')return 'idle:'+$('source').value;const s=engine.sample(time);return 'idle:'+s.wing+'-'+s.pose+'-'+hemAt(time,false,true)}
function render(){const time=now();let key;if(pickStart===null){key=idleKey(time);$('status').textContent=(paused?'已暂停':'播放中')+' · 待机来源 · '+Math.floor(time)+'毫秒';}else{const elapsed=Math.max(0,time-pickStart),s=pickupAt(elapsed);key='pick:'+pickupFrames[s.index];$('status').textContent=s.done?'拿起结束 · 持握入口静止 · 拖动循环待下一项':(paused?'已暂停':'播放中')+' · 拿起第'+(s.index+1)+'项 · '+Math.floor(elapsed)+' / 360毫秒';}for(const id of ['light','dark'])$(id).src=images[key];lastShown=key;$('take').disabled=pickStart!==null;$('prev').disabled=pickStart===null;$('next').disabled=pickStart===null;requestAnimationFrame(render)}
$('take').onclick=()=>{const captured=lastShown;$('captured').src=images[captured];$('first').src=images['pick:neutral'];$('risk').textContent=captured==='idle:A-open-base'?'本来源与首项A原PNG一致。':'当前源 '+captured.slice(5)+' 立即切到A：存在回正/收翼/表情或衣摆复位接缝，待用户判断。';pickStart=now();};
$('reset').onclick=()=>{pickStart=null};$('source').onchange=()=>{pickStart=null};
function stop(){if(!paused)t=now();paused=true;$('pause').textContent='继续'}
$('pause').onclick=()=>{if(paused){origin=performance.now()-t;paused=false;$('pause').textContent='暂停'}else stop()};
$('next').onclick=()=>{stop();const e=t-pickStart;t=pickStart+([80,160,260,360].find(x=>x>e+.001)??360)};
$('prev').onclick=()=>{stop();const e=t-pickStart;t=pickStart+([0,80,160,260].filter(x=>x<e-.001).at(-1)??0)};
$('scale').onchange=e=>{for(const id of ['light','dark']){$(id).width=96*Number(e.target.value);$(id).height=104*Number(e.target.value)}};$('scale').dispatchEvent(new Event('change'));$('captured').src=images['idle:A-open-base'];$('first').src=images['pick:neutral'];render();
</script></html>
